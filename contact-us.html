    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">

        <div class="container-fluid px-3 px-lg-4 px-xl-5">

            <a class="brand" href="javascript:history.back()" aria-label="MODERKS">

</header>
<!-- ================= Post Title ================= -->
    <h1 style="text-align: center; color: #800000; margin-top: 30px; margin-bottom: 20px;">Contact Us - MODERKD</h1>

    <!-- ================= BLANK CONTENT ================= -->
    <main>

<style>
/* Modern & Fully Responsive Contact Form - Maroon Theme (#800000) */
.contact-form-widget {
  width: 100%;
  max-width: 480px;
  margin: 15px auto;
  padding: 25px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  box-sizing: border-box;
}

.contact-form-widget *, 
.contact-form-widget *:before, 
.contact-form-widget *:after {
  box-sizing: border-box;
}

/* Form Container */
.contact-form-widget .form {
  width: 100%;
}

.contact-form-widget form {
  display: flex;
  flex-direction: column;
  width: 100%;
}

/* Field Group & Labels */
.contact-form-widget .field-group {
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  width: 100%;
}

.contact-form-widget label {
  font-size: 14px;
  font-weight: 600;
  color: #333333;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
}

.contact-form-widget label .required {
  color: #800000;
  margin-left: 4px;
  font-size: 16px;
}

/* Input Fields & Textarea */
.contact-form-widget input[type="text"],
.contact-form-widget textarea {
  width: 100%;
  max-width: 100%;
  padding: 10px 14px;
  border: 1.5px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
  color: #333333;
  background-color: #fafafa;
  transition: all 0.3s ease;
  outline: none;
}

.contact-form-widget input[type="text"]:focus,
.contact-form-widget textarea:focus {
  border-color: #800000;
  background-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(128, 0, 0, 0.1);
}

.contact-form-widget textarea {
  resize: vertical;
  min-height: 100px;
  max-height: 250px;
}

/* Heightwise Centered Submit Button */
.contact-form-widget .contact-form-button-submit {
  width: 100%;
  height: 48px;
  padding: 0 20px;
  line-height: 48px;
  background-color: #800000;
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 12px rgba(128, 0, 0, 0.2);
  margin-top: 10px;
}

.contact-form-widget .contact-form-button-submit:hover {
  background-color: #660000;
  transform: translateY(-1px);
  box-shadow: 0 6px 15px rgba(128, 0, 0, 0.3);
}

/* Status Messages Container */
.contact-form-widget .message-container {
  width: 100%;
  margin-top: 12px;
  text-align: center;
}

.contact-form-widget .contact-form-error-message,
.contact-form-widget .contact-form-success-message {
  font-size: 13px;
  margin: 0;
  padding: 6px;
  border-radius: 6px;
}

.contact-form-widget .contact-form-error-message {
  color: #d9534f;
}

.contact-form-widget .contact-form-success-message {
  color: #28a745;
}

/* Extra Mobile Adjustments */
@media (max-width: 480px) {
  .contact-form-widget {
    padding: 15px 12px;
    margin: 5px auto;
    border-radius: 6px;
  }
}
</style>

<div class="contact-form-widget">
  <div class="form">
    <form name="contact-form">
      
      <!-- Name Field -->
      <div class="field-group">
        <label for="ContactForm1_contact-form-name">Name</label>
        <input class="contact-form-name" id="ContactForm1_contact-form-name" name="name" type="text" value="" placeholder="Enter your full name">
      </div>

      <!-- Email Field -->
      <div class="field-group">
        <label for="ContactForm1_contact-form-email">Email <span class="required">*</span></label>
        <input class="contact-form-email" id="ContactForm1_contact-form-email" name="email" type="text" value="" placeholder="Enter your email address">
      </div>

      <!-- Message Field -->
      <div class="field-group">
        <label for="ContactForm1_contact-form-email-message">Message <span class="required">*</span></label>
        <textarea class="contact-form-email-message" id="ContactForm1_contact-form-email-message" name="email-message" rows="4" placeholder="Write your message here..."></textarea>
      </div>

      <!-- Submit Button -->
      <input class="contact-form-button contact-form-button-submit" id="ContactForm1_contact-form-submit" type="button" value="Send Message">

      <!-- Status Messages -->
      <div class="message-container">
        <p class="contact-form-error-message" id="ContactForm1_contact-form-error-message"></p>
        <p class="contact-form-success-message" id="ContactForm1_contact-form-success-message"></p>
      </div>

    </form>
  </div>
</div>

    </main>

    <!-- ================= ADS BANNER (HEADER KE NICHE) ================= -->
    <div id="ads-banner-container"></div>


    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">
            <!-- Copyright Bar -->
            <div class="footer-bottom">
                <div class="row align-items-center g-2">

                    <div class="col-12 col-md-6">
                        <p class="mb-0"><b>
                            &copy; <span id="currentYear"></span>
                            <span id="copyrightName">MODERKD</span>.
                            All rights reserved.
                        </b></p>
                    </div>
                </div>
            </div>
    </footer>

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Automatic Copyright Year -->
    <script>
        (() => {
            "use strict";

            const yearElement = document.getElementById("currentYear");

            if (yearElement) {
                yearElement.textContent = new Date().getFullYear();
            }
        })();
    </script>
    <script src="ads.js"></script>
</body>
</html>
